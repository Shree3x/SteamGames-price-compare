name: Playwright Tests
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install dev dependencies for automation scripts
      run: npm install --save-dev playwright typescript ts-node
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # - name: Run Playwright tests
    #   run: npx playwright test

    - name: Run individual automation script
      run: npx ts-node src/automation/ScrapeGameCurrentPrice.ts
      env:
        MY_USERNAME: ${{ secrets.MY_USERNAME }}
        MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        
    - name: Run next automation script if previous passed
      if: ${{ success() }}
      run: npx ts-node src/automation/ComparePrices.ts
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30